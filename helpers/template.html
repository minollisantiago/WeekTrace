const coverage=section('Coverage & timing');coverage.append(el('p','Split at gaps longer than 30 minutes; clipped to the selected local calendar dates and split visually at midnight. Today includes only activity collected so far. Minimum block height never adds time. Isolated events have unknown duration.','notes'),el('p',D.method,'notes'));D.inventory.forEach(p=>coverage.append(el('p',`${p.project}: ${p.sessions} retained sessions examined; ${p.excludedSubagents} represented subagents excluded.`,'notes')));D.notes.forEach(note=>coverage.append(el('p',note,'notes')));coverage.append(el('p',`${D.possibleCommits} Git commits in the selected range without a confirmed session link. Possible matches shown in details.`,'notes'));
if(D.usage?.missing)coverage.append(el('p',`Token coverage: ${D.usage.missing} model calls have no recorded usage; token totals are incomplete.`,'notes'));
const dialog=document.getElementById('details');document.getElementById('close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>opener?.focus());dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
const first=D.blocks.length?Math.min(...D.blocks.map(b=>b.minute)):0;document.getElementById('calendar-scroll').scrollTop=Math.max(0,(first/60-1)*44);
</script></body></html>
